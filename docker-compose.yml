services:
  # PHP Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pos-api-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_PASSWORD: root
    depends_on:
      - db
    networks:
      - pos-network

  # Nginx Web Service
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - pos-network

  # Database Service
  db:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "33060:3306"
    environment:
      MYSQL_DATABASE: pos_api
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - pos-network

volumes:
  dbdata:
    driver: local

networks:
  pos-network:
    driver: bridge
